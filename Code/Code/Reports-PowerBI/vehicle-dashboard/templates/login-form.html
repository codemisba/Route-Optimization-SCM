<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Route Optimization System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(to right, #0d6efd, #6610f2);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      font-size: 16px;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .form-control:focus {
      box-shadow: none;
      border-color: #0d6efd;
    }
    .form-label {
      font-weight: 600;
    }
    .captcha-img {
      height: 40px;
      object-fit: contain;
      border: 1px solid #ccc;
      padding: 4px;
      background: #fff;
    }
    @media (max-width: 576px) {
      .card {
        margin: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="card p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
     <h4 class="fw-bold text-primary">Dynamic Route Optimization</h4>
       <p class="text-muted"><b>Login</b> </p>
      
    </div>
    <form method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label d-flex justify-content-between">
          <span>Password</span>
          <a href="#" class="small text-decoration-none">Forgot Password?</a>
        </label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Captcha</label>
        <div class="d-flex align-items-center gap-2">
          <img src="https://dummyimage.com/100x40/cccccc/000000&text=AB12" alt="Captcha" class="captcha-img" />
          <input type="text" class="form-control" placeholder="Enter Captcha" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
    </form>
    <div class="text-center mt-3">
      <span class="text-muted">New User?</span>
      <a href="#" class="text-decoration-none">Create Account</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
