<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Routing & Scheduling Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/fontawesome.min.css">
    
    <style>
        #map { height: 600px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">Vehicle Routing & Scheduling Dashboard</h2>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([28.6139, 77.2090], 5); // Centered over India

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch('/api/routes')
        .then(response => response.json())
        .then(data => {
            data.routes.forEach(route => {
                const points = route.path.map(p => [p.lat, p.lon]);

                L.polyline(points, { color: 'red' }).addTo(map)
                    .bindPopup(`<b>Vehicle:</b> ${route.vehicle}<br><b>Schedule:</b> ${route.schedule}`);
            });
        });
</script>
</body>
</html>
